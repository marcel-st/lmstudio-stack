services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

  lmstudio:
    build:
      context: ./lmstudio
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "1234:1234"
    volumes:
      - lmstudio_models:/home/lmstudio/.lmstudio/models
      - lmstudio_data:/home/lmstudio/.lmstudio
    environment:
      HOME: /home/lmstudio
      GEMMA_MODEL: ${GEMMA_MODEL:-google/gemma-4-e4b}
      GEMMA_CONTEXT_LENGTH: ${GEMMA_CONTEXT_LENGTH:-8192}
      QWEN_MODEL: ${QWEN_MODEL:-qwen/qwen2.5-coder-7b}
      QWEN_CONTEXT_LENGTH: ${QWEN_CONTEXT_LENGTH:-8192}
      LMS_SERVER_HOST: 0.0.0.0
      LMS_SERVER_PORT: 1234
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:1234/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      # 1800s covers first-run model downloads (can take 20-60 min for both models)
      start_period: 1800s

  litellm:
    build:
      context: ./litellm
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LMSTUDIO_API_BASE: http://lmstudio:1234/v1
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "4"]
    depends_on:
      postgres:
        condition: service_healthy
      lmstudio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  lmstudio_models:
  lmstudio_data:
