services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

  lmstudio:
    build:
      context: ./lmstudio
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "1234:1234"
    volumes:
      - lmstudio_models:/home/lmstudio/.lmstudio/models
      - lmstudio_data:/home/lmstudio/.lmstudio
    environment:
      HOME: /home/lmstudio
      MODEL: ${MODEL:-google/gemma-4-12b}
      # Alias exposed in /v1/models and used by LiteLLM; defaults to basename of MODEL
      MODEL_IDENTIFIER: ${MODEL_IDENTIFIER:-gemma-4-12b}
      CONTEXT_LENGTH: ${CONTEXT_LENGTH:-16384}
      # GPU_MODE: max (default) | off | auto
      #   max  → --n-gpu-layers -1 (all layers on GPU)
      #   off  → --n-gpu-layers  0 (CPU only)
      #   auto → same as max in current entrypoint
      GPU_MODE: ${GPU_MODE:-max}
      LMS_SERVER_HOST: 0.0.0.0
      LMS_SERVER_PORT: 1234
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:1234/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      # 1800s covers first-run model download (~8 GB, can take 10-30 min)
      start_period: 1800s

  litellm:
    build:
      context: ./litellm
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LMSTUDIO_API_BASE: http://lmstudio:1234/v1
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    depends_on:
      postgres:
        condition: service_healthy
      lmstudio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    depends_on:
      - lmstudio
      - litellm

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/llm-stack.json
    depends_on:
      - prometheus

volumes:
  postgres_data:
  lmstudio_models:
  lmstudio_data:
  prometheus_data:
  grafana_data:
