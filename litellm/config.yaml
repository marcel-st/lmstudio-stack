model_list:
  - model_name: qwen3-14b
    litellm_params:
      # 'openai/' prefix routes through the OpenAI-compatible endpoint.
      # The suffix must match the --identifier used in entrypoint.sh.
      model: openai/qwen3-14b
      api_base: os.environ/LMSTUDIO_API_BASE
      api_key: none
      # Disable Qwen3 thinking mode by default — saves 500–2000 tok of silent
      # reasoning overhead per request. Re-enable per-request when needed:
      #   {"enable_thinking": true, "thinking": {"type": "enabled", "budget_tokens": 2048}}
      extra_body:
        enable_thinking: false
    model_info:
      id: qwen3-14b
      max_input_tokens: 8192
      max_output_tokens: 8192
      context_window: 8192

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  salt_key: os.environ/LITELLM_SALT_KEY
  database_url: os.environ/DATABASE_URL
  # Persists model config edits made in the admin UI across restarts.
  # After first startup, DB values take precedence over this file.
  store_model_in_db: true
  # Allows both admin and internal_user roles to access the UI
  ui_access_mode: all

router_settings:
  # Reject requests that exceed a model's context_window before forwarding
  enable_pre_call_checks: true

litellm_settings:
  # Stream tokens as they're generated — users see output immediately
  # rather than waiting for the full response.
  stream: true
  request_timeout: 300
