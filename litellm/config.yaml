model_list:
  - model_name: gemma-4-e4b
    litellm_params:
      # 'openai/' prefix routes through the OpenAI-compatible endpoint
      # The suffix must match the --identifier used in entrypoint.sh
      model: openai/gemma-4-e4b
      api_base: os.environ/LMSTUDIO_API_BASE
      api_key: none
    model_info:
      id: gemma-4-e4b
      max_input_tokens: 4096
      max_output_tokens: 4096
      context_window: 4096

  - model_name: qwen2.5-coder-7b
    litellm_params:
      model: openai/qwen2.5-coder-7b
      api_base: os.environ/LMSTUDIO_API_BASE
      api_key: none
    model_info:
      id: qwen2.5-coder-7b
      max_input_tokens: 4096
      max_output_tokens: 4096
      context_window: 4096

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  salt_key: os.environ/LITELLM_SALT_KEY
  database_url: os.environ/DATABASE_URL
  # Persists model config edits made in the admin UI across restarts.
  # After first startup, DB values take precedence over this file.
  store_model_in_db: true
  # Allows both admin and internal_user roles to access the UI
  ui_access_mode: all

router_settings:
  # Reject requests that exceed a model's context_window before forwarding
  enable_pre_call_checks: true

litellm_settings:
  drop_params: true
  # Stream tokens as they're generated — users see output immediately
  # rather than waiting for the full response. Dramatically reduces
  # perceived latency for slow or CPU-offloaded inference.
  stream: true
  request_timeout: 300
