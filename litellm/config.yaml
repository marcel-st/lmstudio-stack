model_list:
  - model_name: gemma-4-12b
    litellm_params:
      # 'openai/' prefix routes through the OpenAI-compatible endpoint.
      # The suffix must match the --identifier used in entrypoint.sh.
      model: openai/gemma-4-12b
      api_base: os.environ/LMSTUDIO_API_BASE
      api_key: none
      # Without this, LM Studio omits usage counts from streaming chunks and
      # LiteLLM records 0 tokens → €0 cost for every request.
      stream_options:
        include_usage: true
      # Electricity-based pricing (€0.19538/kWh, RTX 5060 Ti ~160 W inference load).
      # input:  150 tok/s prefill  → €0.000008683/s ÷ 150 = €0.058/M tokens
      # output:  30 tok/s decode   → €0.000008683/s ÷  30 = €0.29/M tokens
      # LiteLLM labels these as "$" in the UI; values are in €.
      input_cost_per_token: 0.000000058
      output_cost_per_token: 0.00000029
    model_info:
      id: gemma-4-12b
      mode: chat
      max_input_tokens: 16384
      max_output_tokens: 16384
      context_window: 16384
      # Duplicated here for the UI spend display (litellm_params covers the router).
      input_cost_per_token: 0.000000058
      output_cost_per_token: 0.00000029

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  salt_key: os.environ/LITELLM_SALT_KEY
  database_url: os.environ/DATABASE_URL
  # Persists model config edits made in the admin UI across restarts.
  # After first startup, DB values take precedence over this file.
  store_model_in_db: true
  # Allows both admin and internal_user roles to access the UI
  ui_access_mode: all

router_settings:
  # Reject requests that exceed a model's context_window before forwarding
  enable_pre_call_checks: true

litellm_settings:
  # Stream tokens as they're generated — users see output immediately
  # rather than waiting for the full response.
  stream: true
  request_timeout: 300
