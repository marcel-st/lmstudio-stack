name: Bug report
description: Something isn't working correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check `docker compose ps` and `docker compose logs` for obvious errors.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `docker compose up -d`
        2. Run `curl ...`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output of `docker compose logs --tail=50 <service>` or `docker compose ps`
      render: shell

  - type: input
    id: os
    attributes:
      label: Host OS
      placeholder: "e.g. CachyOS (Arch), Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: driver
    attributes:
      label: NVIDIA driver version
      description: Output of `nvidia-smi --query-gpu=driver_version --format=csv,noheader`
      placeholder: "e.g. 560.35.03"
    validations:
      required: true

  - type: input
    id: docker
    attributes:
      label: Docker + Compose versions
      description: Output of `docker version --format '{{.Server.Version}}'` and `docker compose version`
      placeholder: "e.g. Docker 27.3.1, Compose 2.29.7"
    validations:
      required: true
